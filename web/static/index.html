<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛩ FINVIZ FEED // watch & scalp</title>
    <link rel="stylesheet" href="/style.css?v=8">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span class="status-indicator status-live"></span>
                ⛩ FINVIZ FEED // watch & scalp
                <span id="elite-badge" class="elite-badge" style="display: none;">⚡ ELITE</span>
            </h1>
            <div class="header-stats">
                <div class="stat-item">
                    <span class="stat-label">Total News</span>
                    <span class="stat-value" id="total-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Matches</span>
                    <span class="stat-value" id="match-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Last Update</span>
                    <span class="stat-value" id="last-update">--:--</span>
                </div>
            </div>
        </header>

        <!-- Matched Signals Section -->
        <section class="matched-section">
            <div class="section-header matched-header">
                <h2>MATCHED SIGNALS</h2>
                <div class="keywords-display">
                    Watching: <span id="keywords-list">loading...</span>
                </div>
            </div>
            
            <!-- Keyword Management UI -->
            <div class="keyword-management">
                <div class="keyword-input-group">
                    <input type="text" id="keyword-input" placeholder="Add keyword..." />
                    <button id="add-keyword-btn" class="btn btn-add">+ Add</button>
                    <button id="clear-all-btn" class="btn btn-clear">Clear UI Keywords</button>
                    <button id="reload-file-btn" class="btn btn-reload">↻ Reload File</button>
                </div>
                
                <div class="keywords-container">
                    <div class="keywords-group">
                        <div class="keywords-group-header">From keywords.txt:</div>
                        <div id="file-keywords" class="keyword-tags"></div>
                    </div>
                    <div class="keywords-group">
                        <div class="keywords-group-header">Added in UI:</div>
                        <div id="runtime-keywords" class="keyword-tags"></div>
                    </div>
                </div>
            </div>
            
            <div id="matched-content" class="content matched-content">
                <div class="loading">...no hits yet... (★ leave window open)</div>
            </div>
        </section>

        <!-- All Traffic Section -->
        <section class="all-section">
            <div class="section-header all-header">
                <h2>ALL TRAFFIC (finviz order)</h2>
            </div>
            <div id="all-content" class="content all-content">
                <div class="loading">Loading feed...</div>
            </div>
        </section>
    </div>

    <script src="/app.js?v=6"></script>
</body>
</html>
