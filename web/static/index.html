<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISAN Scanner</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="urgent-alert" class="urgent-alert hidden">
        <div class="urgent-alert-content">
            <div class="urgent-badge">🚨 URGENT 🚨</div>
            <div class="urgent-tickers" id="urgent-tickers"></div>
            <div class="urgent-title" id="urgent-title"></div>
            <button class="urgent-close" onclick="closeUrgentAlert()">CLOSE</button>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="header-left">
                <div class="header-text">NISAN Scanner</div>
                <div class="unread-counter" id="unread-counter"></div>
                <a href="?simulate=true" class="test-link" title="Simulate multiple breaking news alerts">SIMULATE</a>
            </div>
            <div class="header-right">
                <button class="clear-read-btn" onclick="clearReadTitles()" title="Clear all read items (Press C)">Clear Read</button>
            </div>
        </header>

        <section class="matched-section">
            <div class="section-header">
                Matched Signals
            </div>
            <div id="matched-content" class="content matched-content">
                <div class="loading">No matches yet. Waiting for news…</div>
            </div>
        </section>
    </div>

    <script src="/app.js"></script>
</body>
</html>
