<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finviz Scanner</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="urgent-alert" class="urgent-alert hidden">
        <div class="urgent-alert-content">
            <span class="urgent-badge">🚨 URGENT</span>
            <div class="urgent-info">
                <div class="urgent-tickers" id="urgent-tickers"></div>
                <div class="urgent-title" id="urgent-title"></div>
            </div>
            <button class="urgent-close" onclick="closeUrgentAlert()">×</button>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="header-text">Finviz Scanner</div>
        </header>

        <section class="matched-section">
            <div class="section-header">
                Matched Signals
            </div>
            <div id="matched-content" class="content matched-content">
                <div class="loading">No matches yet. Waiting for news…</div>
            </div>
        </section>
    </div>

    <script src="/app.js"></script>
</body>
</html>
